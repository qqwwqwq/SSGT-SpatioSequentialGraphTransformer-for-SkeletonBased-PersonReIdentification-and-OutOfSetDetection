# Optional Linux x86_64 recipe reconstructed from the measured GPU environment.
# Package metadata were inspected; fresh environment creation was not tested.
# Keep NumPy's measured MKL build: a PyPI NumPy wheel uses a different BLAS.
name: ssgt-reproduction
channels:
  - defaults
  - nodefaults
dependencies:
  - python=3.7.13=h12debd9_0
  - pip
  - blas=1.0=mkl
  - numpy=1.19.2=py37h54aff64_0
  - numpy-base=1.19.2=py37hfa32c7d_0
  - mkl=2020.2=256
  - intel-openmp=2022.0.1=h06a4308_3633
  - mkl-service=2.3.0=py37he8ac12f_0
  - mkl_fft=1.3.0=py37h54f3939_0
  - mkl_random=1.1.1=py37h0573a6f_0
  - pip:
      - '--index-url https://pypi.org/simple'
      - '--only-binary=:all:'
      # The measured PyPI distribution is 1.13.1; torch.__version__ reports
      # 1.13.1+cu117 with these separately installed CUDA runtime packages.
      - torch==1.13.1
      - nvidia-cublas-cu11==11.10.3.66
      - nvidia-cuda-nvrtc-cu11==11.7.99
      - nvidia-cuda-runtime-cu11==11.7.99
      - nvidia-cudnn-cu11==8.5.0.96
      - scipy==1.4.1
      - scikit-learn==0.24.2
      - matplotlib==3.5.3
      - threadpoolctl==3.1.0
      - joblib==1.3.2
      - typing-extensions==4.1.1
      # Measured plotting and packaging dependencies compatible with Python 3.7.
      - pillow==8.3.1
      - pyparsing==3.0.4
      - python-dateutil==2.9.0.post0
      - cycler==0.10.0
      - kiwisolver==1.4.5
      - packaging==24.0
      - fonttools==4.38.0
      - six==1.16.0
      - pip==24.0
      - setuptools==60.2.0
      - wheel==0.37.1
variables:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
